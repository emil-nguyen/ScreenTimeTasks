<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skærmtid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3A281D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skærmtid">
<style>
:root{--bg:#F3EBDC;--card:#FBF6EC;--tx:#3A281D;--tx2:rgba(58,40,29,.58);--line:rgba(58,40,29,.12);--btn:#3A281D;--btnTx:#F3EBDC;--ok:#3A281D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C130E;--card:#2A1D15;--tx:#F3EBDC;--tx2:rgba(243,235,220,.6);--line:rgba(243,235,220,.14);--btn:#F3EBDC;--btnTx:#2A1D15;--ok:#F3EBDC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C130E;--card:#2A1D15;--tx:#F3EBDC;--tx2:rgba(243,235,220,.6);--line:rgba(243,235,220,.14);--btn:#F3EBDC;--btnTx:#2A1D15;--ok:#F3EBDC;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0 20px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:28px 16px 8px}
.card{background:var(--card);border-radius:22px;box-shadow:0 1px 2px rgba(58,40,29,.06)}
.hero{padding:26px 22px;text-align:center}
.hero small{color:var(--tx2);font-size:15px}
.big{font-size:56px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 18px}
.btn{appearance:none;border:0;background:var(--btn);color:var(--btnTx);font:600 17px inherit;font-family:inherit;border-radius:14px;padding:14px 22px;width:100%;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.35}
.btn.run{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--tx)}
.add{padding:14px;display:flex;flex-direction:column;gap:12px}
input[type=text]{width:100%;border:0;background:transparent;color:var(--tx);font:inherit;font-size:17px;padding:6px 4px;outline:none;border-bottom:1px solid var(--line)}
input::placeholder{color:var(--tx2)}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font:500 14px inherit;font-family:inherit;padding:8px 0;border-radius:9px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(58,40,29,.18)}
.mrow{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border:0;border-radius:50%;background:var(--card);color:var(--tx);font:600 22px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(58,40,29,.18);transition:transform .15s}
.step button:active{transform:scale(.9)}
.step input{width:56px;border:0;background:transparent;color:var(--tx);font:700 22px inherit;font-family:inherit;text-align:right;outline:none;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step span{color:var(--tx2);font-size:15px;margin-right:4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);animation:in .3s ease}
li:first-child{border-top:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--tx2);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:.2s}
.chk svg{width:16px;height:16px;stroke:var(--btnTx);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.2s}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .chk svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--tx2)}
.t{flex:1;min-width:0;overflow-wrap:anywhere}
.m{font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap}
.x{border:0;background:none;color:var(--tx2);font-size:22px;line-height:1;cursor:pointer;padding:4px}
.empty{padding:26px;text-align:center;color:var(--tx2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--btn);color:var(--btnTx);padding:11px 20px;border-radius:99px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <h1>Skærmtid</h1>
  <div class="card hero">
    <small id="lbl">Din optjente skærmtid</small>
    <div class="big" id="bal">0 min</div>
    <button class="btn" id="go">Start skærmtid</button>
  </div>

  <h2>Ny opgave</h2>
  <div class="card add">
    <input type="text" id="inp" placeholder="Hvad skal laves?" maxlength="80" autocomplete="off">
    <div class="mrow"><span>Belønning</span><div class="step"><button id="mm" aria-label="Mindre">−</button><input type="number" id="mn" inputmode="numeric" min="1" max="600" value="15"><span>min</span><button id="mp" aria-label="Mere">+</button></div></div>
    <button class="btn" id="addBtn">Tilføj opgave</button>
  </div>

  <h2>Opgaver</h2>
  <div class="card"><ul id="todo"></ul></div>

  <h2 id="dh" hidden>Klaret</h2>
  <div class="card" id="dc" hidden><ul id="done"></ul></div>
</main>
<div class="toast" id="toast"></div>

<script>
let S={tasks:[],bal:0,endAt:null},mins=15;
try{const r=localStorage.getItem('skaermtid');if(r)S=JSON.parse(r)}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('skaermtid',JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;
 if(S.endAt)return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 const h=Math.floor(m/60);return h?h+' t '+(m%60)+' min':m+' min'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function render(){
 const run=!!S.endAt;paint();
 $('lbl').textContent=run?'Skærmtid kører':'Din optjente skærmtid';
 const g=$('go');g.textContent=run?'Stop':'Start skærmtid';g.className='btn'+(run?' run':'');g.disabled=!run&&cur()<=0;
 const row=t=>`<li class="${t.done?'done':''}"><button class="chk" data-id="${t.id}" aria-label="Markér"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></button><span class="t">${esc(t.t)}</span><span class="m">+${t.m} min</span><button class="x" data-del="${t.id}" aria-label="Slet">×</button></li>`;
 const a=S.tasks.filter(t=>!t.done),b=S.tasks.filter(t=>t.done);
 $('todo').innerHTML=a.length?a.map(row).join(''):'<div class="empty">Ingen opgaver. Tilføj en for at optjene tid.</div>';
 $('done').innerHTML=b.map(row).join('');
 $('dh').hidden=$('dc').hidden=!b.length;
}
// Tiden bygger på et sluttidspunkt (endAt), så den kører korrekt i baggrunden
const cur=()=>S.endAt?Math.max(0,Math.ceil((S.endAt-Date.now())/1000)):S.bal;
function paint(){$('bal').textContent=fmt(cur());document.title=S.endAt?fmt(cur())+' · Skærmtid':'Skærmtid'}
function adj(d){if(S.endAt)S.endAt=Math.max(Date.now(),S.endAt+d*1000);else S.bal=Math.max(0,S.bal+d);sched()}
let W=null;try{W=new Worker(URL.createObjectURL(new Blob(['let t;onmessage=e=>{clearTimeout(t);if(e.data>0)t=setTimeout(()=>postMessage(1),e.data)}'])));W.onmessage=()=>check()}catch(e){}
function sched(){if(W)W.postMessage(S.endAt?S.endAt-Date.now():-1)}
function check(){if(S.endAt&&cur()<=0)finish();else if(S.endAt)paint()}
function finish(){S.bal=0;S.endAt=null;save();render();notify()}
async function notify(){
 toast('Din skærmtid er gået');
 try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
 try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted'){
  const o={body:'Din skærmtid er brugt. Klar flere opgaver for at tjene mere.',icon:'icon-192.png',tag:'done',requireInteraction:true};
  const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
  r?r.showNotification('Skærmtiden er slut',o):new Notification('Skærmtiden er slut',o)}}catch(e){}
}
$('go').onclick=async()=>{
 if(S.endAt){S.bal=cur();S.endAt=null}
 else if(S.bal>0){S.endAt=Date.now()+S.bal*1000;
  if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  if('Notification' in window&&Notification.permission==='denied')toast('Slå notifikationer til i indstillinger')}
 sched();save();render()};
const mn=$('mn');
const setM=v=>{mins=Math.min(600,Math.max(1,Math.round(+v)||1));mn.value=mins};
$('mm').onclick=()=>setM(Math.ceil(mins/5)*5-5);
$('mp').onclick=()=>setM(Math.floor(mins/5)*5+5);
mn.oninput=()=>{const v=+mn.value;if(v>0)mins=Math.min(600,Math.round(v))};
mn.onblur=()=>setM(mn.value);
function add(){const v=$('inp').value.trim();if(!v){$('inp').focus();return}
 S.tasks.push({id:Date.now(),t:v,m:mins,done:false});$('inp').value='';save();render()}
$('addBtn').onclick=add;
$('inp').onkeydown=e=>{if(e.key==='Enter')add()};
document.addEventListener('click',e=>{
 const c=e.target.closest('.chk'),d=e.target.closest('.x');
 if(c){const t=S.tasks.find(x=>x.id==c.dataset.id);t.done=!t.done;
  adj((t.done?1:-1)*t.m*60);
  if(t.done)toast('+'+t.m+' min optjent');if(navigator.vibrate)navigator.vibrate(10);save();render()}
 if(d){const t=S.tasks.find(x=>x.id==d.dataset.del);if(t.done)adj(-t.m*60);
  S.tasks=S.tasks.filter(x=>x!==t);save();render()}
});
setInterval(check,500);
document.addEventListener('visibilitychange',check);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();check();sched();
</script>
</body>
</html>
